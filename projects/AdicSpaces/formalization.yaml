    finite-jet development is stated over an ABSTRACT base — a complete ultrametric
    nonarchimedean field with a pseudouniformizer (`FiniteJet.IsFJPBase`) — rather than only
    over Laurent series, so it covers mixed characteristic.
  sorry_count: 45                  # all in ScottishBook/Stated: the 38 problems that remain
