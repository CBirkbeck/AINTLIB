      note: "[FJP] Theorem 1.3 (sheafy). Requires IsFJPNoetherianBase."
    - source: "fjp"
      lean: "FiniteJet.finiteJet_not_stablyUniform"
      module: "«Adic spaces».FJP.FiniteJetMain"
      status: "proved"
      note: "[FJP] Theorem 1.3 / Corollary 3.2."
    - source: "fjp"
      lean: "FiniteJet.chartEquiv"
      module: "«Adic spaces».FJP.FiniteJetChart"
      status: "proved"
      note: "[FJP] Proposition 3.1: 𝓐⟨W/ϖ⟩ ≅ K⟨X,Q⟩/(Q²)."
    - source: "nonarchimedean-scottish-book"
      lean: "ScottishBook.problem28"
      module: "«Adic spaces».ScottishBook.Stated.Problem028"
      status: "proved-restated"
