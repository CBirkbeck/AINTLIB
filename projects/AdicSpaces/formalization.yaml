  methods:
    - method: "result discovery — the underlying mathematics"
      models: ["ChatGPT 5.6 Sol"]
      framework: ""
      tool_setup: ""
      cost:
        wall_time: ""
        spend_usd: "1 month of a ChatGPT Pro subscription (flat-rate, not metered)"
        hardware: ""
      prompting_notes: >-
        Per the source paper's abstract, its two main results are due to ChatGPT 5.6 Sol.
        This is provenance of the MATHEMATICS, not of the Lean code.
    - method: "Lean formalization"
      models: ["Claude Fable 5"]
      framework: "Claude Code"
      tool_setup: >-
        Lean 4 with mathlib; per-project dev branches in one Lake workspace; automated
        cleanup lanes on `main`. See CLAUDE.md.
      cost:
        wall_time: ""
        spend_usd: "4 months of a Claude Code Max 20x subscription (flat-rate, not metered)"
        hardware: ""
      prompting_notes: >-
        The source paper records that the Lean formalisation was carried out by Claude Code.
  spend_usd: "4 months Claude Code Max 20x + 1 month ChatGPT Pro"
  notes: >-
    COST CAVEAT: both figures are flat-rate subscriptions, not per-token metering, and each
    subscription covered all of the holder's work over that period rather than this project
