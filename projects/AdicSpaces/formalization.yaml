fidelity:
  divergences: >-
    (1) SCOPE OF THE BASE. [FJP] states its theorem over a complete DISCRETELY VALUED
    nonarchimedean field. The formalization is stated over the weaker `IsFJPBase` (complete
    ultrametric field + pseudouniformizer, no discreteness) wherever that suffices, which is
    everything except sheafiness. Discreteness is isolated in a second class,
    `IsFJPNoetherianBase` (the Gauss unit ball is noetherian).

    (2) SHEAFINESS IS EQUAL-CHARACTERISTIC ONLY. `IsFJPNoetherianBase` is discharged for
    `K = F((t))` (`FJP/FJPBaseLaurent.lean`) by an elementary transpose argument. It is NOT
    discharged for `ℚ_p`: that needs Stacks 00MA (the ϖ-adic completion of a noetherian ring
    is noetherian), which is a mathlib gap — this repository's `AdicCompletion.isNoetherianRing`
    is sorry-backed and is deliberately not used. So `FJP/FJPBasePadic.lean` provides only
    `IsFJPBase ℚ_[p]`, and Scottish Book 24/28 hold there while sheafiness does not.

    (3) PROBLEM 28 IS RESTATED. Kedlaya's wording ("f restricts to zero on some rational
    subspace") is formalized with the structure-presheaf value `presheafValue D` and
    `D.canonicalMap`, NOT with `algebraMap A (Localization.Away D.s)`. Over the algebraic
    localization the statement is satisfiable only degenerately (nilpotent `s`, for which
    `R(T/s)` is empty), and the [FJP] phenomenon is a separated-completion effect invisible
    there. The formal statement additionally requires the rational subset to be nonempty and
    its chart nonzero, closing that loophole.

    (4) PROBLEM 28 IS ANSWERED IN THE TATE CASE ONLY. Kedlaya asks about "Tate/perfectoid";
    the witness is a complete uniform nonnoetherian Tate domain, not a perfectoid ring, so
    the perfectoid half remains open.

    (5) PROBLEM 24, ALGEBRAIC FORM. `ScottishBook.problem24_algebraic` is a triviality (every
    localization is flat) and is recorded only to make clear that the content of the problem
    is entirely in the completed localization.

