    measurement of it, and no USD figure is quoted for that reason.
    Statement-level certification is available via leanprover/comparator; see
    `scripts/certify.sh` and the two configs referenced above. This branch pins Lean
    v4.33.0 (stable) + mathlib v4.33.0 — the first stable release line carrying the fix
    for kernel soundness bug leanprover/lean4#14576.

fidelity:
  divergences: >-
    (1) SCOPE OF THE FJP BASE. The paper states its main theorem over a complete discretely
    valued nonarchimedean field k. The certified statements (`FiniteJetMain.lean`)
    instantiate k at the restricted Laurent-series field over an arbitrary coefficient
    field F — the base of the revision the Lean docstrings cite; the `FiniteJetOver` layer
    additionally states the uniform / domain / nonnoetherian / not-stably-uniform endpoints
    over an abstract such k (any complete ultrametric nontrivially-normed field, with the
    uniformizer explicit or chosen from a DVR hypothesis).
    (2) THE WP BASE. [WP] Theorem 6.2 is certified over an abstract complete ultrametric
    nontrivially-normed field K with `IsDiscreteValuationRing 𝒪[K]` — the paper's "complete
    discretely valued nonarchimedean field", with "discretely valued" rendered as the DVR
    property of the valuation ring.
    (3) RATIONALLY STABLY REDUCED. The paper's "every finite iterated rational localization
    is reduced" is rendered as the cumulative chain recursion `ChainReduced 𝒜 n` for all n
    (depth-≤-n iterated rational localizations are reduced); the certificate quantifies
    over n.
    (4) STRONGLY SHEAFY. The paper's "(strongly) sheafy" (every 𝒜⟨V₁,…,Vₛ⟩ is sheafy) is
    rendered by the shifted-weight algebras (`shiftWeight`, [WP] §6.5): the certificate
    pins sheafiness of `WPA K (shiftWeight id s)` for every s, and sheafiness itself is
    "every valid ring of integral elements gives a sheaf" (`IsSheafyComplete`, the
    complete-ring form of Wedhorn Definition 8.26).
  statement_provenance: >-
    Challenge files (`Adic spaces/Comparator/Challenge.lean`, `WPChallenge.lean`) restate
    the headline conclusions from the definition layer only; their import closures contain
    none of the proving modules (verified mechanically; see `Comparator/README.md`).
  checked_by: ""                   # human sign-off pending

acknowledgements: ""
