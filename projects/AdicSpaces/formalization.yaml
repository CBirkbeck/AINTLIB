  license: "Apache-2.0"            # [required] matches the repository (LICENSE on `main`,
                                   # commit 1c1c74664) and the Lean file headers. Note the
                                   # `dev/adic-spaces` branch predates that commit and so does
                                   # not itself carry the LICENSE file — housekeeping only.

