        The source paper records that the Lean formalisation was carried out by Claude Code.
  spend_usd: "4 months Claude Code Max 20x + 1 month ChatGPT Pro"
  notes: >-
    COST CAVEAT: both figures are flat-rate subscriptions, not per-token metering, and each
    subscription covered all of the holder's work over that period rather than this project
