# formalization.yaml — self-report for the AdicSpaces project, in the schema of
# https://github.com/mathlib-initiative/formalization.yaml (v0.3).
#
# NOTE ON THE TWO FILES. This is NOT the same artifact as the sibling
# `formalisation.yaml` (British spelling, `schema: 1`). That one is a GENERATED
# inventory — cited results, modules, statement digests — consumed by
# `scripts/check_formalisation.py` to detect drift. It is an internal manifest and does not
# follow any external schema. This file is the small, hand-written, standards-conformant
# self-report intended for outside readers and tooling.
#
# FIELDS LEFT BLANK ARE NOT YET KNOWN — the remaining ones (the source licence, spend,
# wall time, hardware, prompting notes, acknowledgements) are human-supplied and are
# deliberately empty rather than guessed.
#
# `sources[].license` is the licence of the SOURCE MATERIAL being formalized — the paper or
# notes whose statements were transcribed — not the licence of this Lean code, which is
# `project.license` above.

version: "v0.3"

project:
  name: "AINTLIB / AdicSpaces"
  authors: ["Christopher Birkbeck"]  # [required] from repo ownership + git history; ADD
                                   # CO-AUTHORS if others contributed to this formalization
                                   # (distinct from the source paper's author list).
  license: "Apache-2.0"            # [required] matches the repository (LICENSE on `main`,
                                   # commit 1c1c74664) and the Lean file headers. This
                                   # branch forked before that commit and so does not
                                   # itself carry the LICENSE file — housekeeping only.

sources:
  - title: "Adic Spaces (lecture notes)"
    authors: ["Torsten Wedhorn"]
    id: "wedhorn-adic-spaces"
    type: "lecture-notes"
    license: "arXiv nonexclusive-distrib/1.0"   # arXiv:1910.05934
    author_contacted: "no"
    prior_work: "None known in Lean at this scope."

  - title: "Uniform sheafy Tate domains that are not stably uniform"
    authors: ["Christopher Birkbeck", "Alex Torzewski"]
    id: "fjp"
    type: "preprint"
    license: "none stated"         # no licence appears on the paper page; the authors may
                                   # wish to state one
    author_contacted: "n/a — a source author is an author of this formalization"
    prior_work: >-
      None known. The paper's two headline theorems are the results formalized here: the
      finite-jet pinching algebra (cited [FJP] in the Lean docstrings; `thm:main`, Theorem
      1.3 in the revision the docstrings cite) and the §6 weighted-parity rationally stably
      reduced example (cited [WP]; `thm:rationally-reduced-example`, Theorem 6.2).
    # https://cbirkbeck.github.io/uniform-sheafy-tate-domains/
    # No arXiv identifier or DOI as of 2026-08-10.

  - title: "The Nonarchimedean Scottish Book"
    authors: ["Kiran S. Kedlaya (editor)"]
    id: "nonarchimedean-scottish-book"
    type: "problem-list"
    license: "none stated"         # the wiki carries no explicit copyright/licence notice
    author_contacted: "no"
    prior_work: "None known in Lean."
    # https://scripts.mit.edu/~kedlaya/wiki/index.php?title=The_Nonarchimedean_Scottish_Book
    # On this branch the problem list is STATED (Lean statements, `sorry` bodies as open
    # problems); the two problems answered by the finite-jet algebra are certified on the
    # `dev/adic-spaces` branch.

status:
  scope: >-
    Huber/Tate rings, adic spectra, rational localizations and the structure presheaf
    (Wedhorn); the [FJP] finite-jet pinching algebra and its chart, over the restricted
    Laurent-series base of the paper's earlier revision (any coefficient field) with a
    generic-CDVF layer (`FiniteJetOver`); the [WP] §6 weighted-parity algebra — uniform,
    strongly sheafy, rationally stably reduced, not stably uniform — over an abstract
    complete ultrametric nonarchimedean field whose valuation ring is a DVR; and formal
    statements of the Nonarchimedean Scottish Book problem list.
  sorry_count: 0                   # scope: the CERTIFIED endpoints reported here — all five
                                   # [FJP] Theorem 1.3 conclusions and seven of the eight
                                   # [WP] Theorem 6.2 endpoints. Their axiom sets are exactly
                                   # [propext, Classical.choice, Quot.sound] (no sorryAx),
                                   # checked per-result by comparator. The one exception is
                                   # [WP] (3) rationally-stably-reduced, which is complete in
                                   # every example-specific input but still consumes the core
                                   # campaign's open Wedhorn Prop 8.30 flatness — see its
                                   # main_results entry. The wider repository tree carries
                                   # WIP `sorry`s outside this report's scope (Scottish Book
                                   # problem STATEMENTS, general 8.28(b) campaign frontiers);
                                   # see the generated `formalisation.yaml` per-group counts.
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

  main_results:
    - declaration: "FiniteJet.finiteJet_isSheafy"
      file: "Adic spaces/FJP/FiniteJetMain.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Adic spaces/Comparator/comparator-config.json"
      literature_dependencies: []

    - declaration: "FiniteJet.finiteJet_not_stablyUniform"
      file: "Adic spaces/FJP/FiniteJetMain.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Adic spaces/Comparator/comparator-config.json"
      literature_dependencies: []

    - declaration: "WeightedParity.weightedParity_isSheafyComplete_of_dvr"
      file: "Adic spaces/WP/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Adic spaces/Comparator/wp-config.json"
      literature_dependencies: []

    - declaration: "WeightedParity.weightedParity_chainReduced_unconditional_of_dvr"
      file: "Adic spaces/WP/Main.lean"
      sorry_count: 0               # no sorry in any WP-side (example-specific) input: all
                                   # head-reducedness leaves are discharged at maximal ideals
      axioms: ["propext", "Classical.choice", "Quot.sound", "sorryAx"]
      # sorryAx enters ONLY through the core development's Wedhorn Prop 8.30 restriction
      # flatness (`prop_8_30_flat_clean`), an open frontier of the general 8.28(b)
      # campaign. The statement is pinned in `Comparator/WPChallenge.lean` but not yet in
      # `theorem_names`; once 8.30 lands, adding the name back completes the certificate.
      comparator_config: "Adic spaces/Comparator/wp-config.json"
      literature_dependencies:
        - "Wedhorn, *Adic Spaces*, Prop 8.30 (rational-restriction flatness) — the one
           open input"

    - declaration: "WeightedParity.weightedParity_not_stablyUniform_of_dvr"
      file: "Adic spaces/WP/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Adic spaces/Comparator/wp-config.json"
      literature_dependencies: []

