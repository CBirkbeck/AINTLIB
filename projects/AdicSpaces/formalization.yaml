  methods:
    - method: "result discovery — the underlying mathematics"
      models: ["ChatGPT 5.6 Sol"]
      framework: ""
      tool_setup: ""
      cost:
        wall_time: ""
        spend_usd: "1 month of a ChatGPT Pro subscription (flat-rate, not metered)"
        hardware: ""
      prompting_notes: >-
        Per the source paper's abstract, its two main results are due to ChatGPT 5.6 Sol.
        This is provenance of the MATHEMATICS, not of the Lean code.
